<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK-BMS 红色战斗风格预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a0000 0%, #0d0000 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            background: linear-gradient(90deg, #FF0000, #FF4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            align-items: flex-start;
        }

        /* 模拟屏幕 */
        .screen-wrapper {
            background: #000;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(255, 0, 0, 0.3),
                        0 0 0 2px #330000;
        }

        .screen {
            width: 320px;
            height: 240px;
            background: #000000;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
            font-family: monospace;
        }

        /* 红色顶部装饰条 */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #FF0000, #FF4444, #FF0000);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }

        /* 战斗网格背景 */
        .grid-overlay {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(rgba(80, 0, 0, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(80, 0, 0, 0.3) 1px, transparent 1px);
            background-size: 40px 30px;
            pointer-events: none;
        }

        /* 标题栏 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            height: 32px;
            position: relative;
            z-index: 1;
        }

        .title {
            font-size: 14px;
            color: #FF0000;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
            letter-spacing: 1px;
        }

        .bt-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bt-icon {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .bt-text {
            font-size: 10px;
            font-weight: 600;
        }

        .bt-connected .bt-icon,
        .bt-connected .bt-text {
            color: #00E676;
        }

        .bt-disconnected .bt-icon,
        .bt-disconnected .bt-text {
            color: #FF0000;
        }

        /* 功率卡片 - 红色战斗风格 */
        .power-card {
            position: absolute;
            top: 32px;
            left: 10px;
            right: 10px;
            height: 95px;
            background: linear-gradient(135deg, #1a0000 0%, #280000 100%);
            border-radius: 8px;
            border: 1px solid #600000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(255, 0, 0, 0.1);
        }

        .power-card::before {
            content: '';
            position: absolute;
            inset: 1px;
            border-radius: 7px;
            border: 1px solid rgba(255, 0, 0, 0.3);
            pointer-events: none;
        }

        .power-label {
            font-size: 10px;
            color: #A80000;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .power-value {
            font-size: 32px;
            font-weight: bold;
            text-shadow: 0 0 20px currentColor, 0 0 40px currentColor;
            transition: color 0.3s ease;
        }

        .power-unit {
            font-size: 14px;
            color: #A80000;
            margin-left: 5px;
        }

        /* 功率条 */
        .power-bar-container {
            position: absolute;
            bottom: 10px;
            left: 12px;
            right: 12px;
            height: 6px;
            background: #300000;
            border-radius: 3px;
            overflow: hidden;
        }

        .power-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease, background 0.3s ease;
            box-shadow: 0 0 10px currentColor;
        }

        /* 电压电流条 */
        .vi-bar {
            position: absolute;
            top: 132px;
            left: 10px;
            right: 10px;
            height: 38px;
            background: linear-gradient(135deg, #1a0000 0%, #280000 100%);
            border-radius: 6px;
            border: 1px solid #600000;
            display: flex;
            overflow: hidden;
        }

        .vi-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .vi-section:first-child {
            align-items: flex-start;
            padding-left: 12px;
        }

        .vi-section:last-child {
            align-items: flex-end;
            padding-right: 12px;
        }

        .vi-label {
            font-size: 8px;
            color: #A80000;
            font-weight: 600;
        }

        .vi-value {
            font-size: 15px;
            font-weight: bold;
        }

        .voltage-value { color: #FF0000; text-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }
        .current-value { transition: color 0.3s ease; text-shadow: 0 0 10px currentColor; }

        .divider {
            position: absolute;
            left: 50%;
            top: 6px;
            bottom: 6px;
            width: 1px;
            background: #600000;
        }

        .direction-arrow {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            font-weight: bold;
        }

        /* 底部卡片容器 */
        .bottom-cards {
            position: absolute;
            top: 175px;
            left: 10px;
            right: 10px;
            height: 58px;
            display: flex;
            gap: 8px;
        }

        /* 容量卡片 */
        .capacity-card {
            flex: 150;
            background: linear-gradient(135deg, #1a0000 0%, #280000 100%);
            border-radius: 6px;
            border: 1px solid #600000;
            padding: 5px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-label {
            font-size: 8px;
            color: #A80000;
            font-weight: 600;
        }

        .capacity-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .soc-value {
            font-size: 18px;
            font-weight: bold;
            color: #FF0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .cap-detail {
            font-size: 9px;
            color: #A80000;
            text-align: right;
        }

        /* 温度卡片 */
        .temp-card {
            flex: 140;
            background: linear-gradient(135deg, #1a0000 0%, #280000 100%);
            border-radius: 6px;
            border: 1px solid #600000;
            padding: 5px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .temp-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .temp-value {
            font-size: 18px;
            font-weight: bold;
            transition: color 0.3s ease;
            text-shadow: 0 0 10px currentColor;
        }

        .mos-temp {
            font-size: 9px;
            color: #A80000;
            text-align: right;
        }

        /* 进度条通用 */
        .progress-bar {
            height: 8px;
            background: #300000;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease, background 0.3s ease;
            box-shadow: 0 0 8px currentColor;
        }

        /* 控制面板 */
        .controls {
            background: rgba(255, 0, 0, 0.05);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 0, 0, 0.2);
            min-width: 300px;
        }

        .controls h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #FF0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: #A80000;
        }

        .control-group input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
            accent-color: #FF0000;
        }

        .control-value {
            text-align: right;
            font-size: 0.9rem;
            color: #FF0000;
            font-weight: 600;
        }

        .status-toggle {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .status-toggle button {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid;
            background: transparent;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .status-toggle button#btn-charge {
            border-color: #00E676;
            color: #00E676;
        }

        .status-toggle button#btn-charge:hover,
        .status-toggle button#btn-charge.active {
            background: #00E676;
            color: #000;
        }

        .status-toggle button#btn-discharge {
            border-color: #FF0000;
            color: #FF0000;
        }

        .status-toggle button#btn-discharge:hover,
        .status-toggle button#btn-discharge.active {
            background: #FF0000;
            color: #000;
        }

        .status-toggle button#btn-idle {
            border-color: #A80000;
            color: #A80000;
        }

        .status-toggle button#btn-idle:hover,
        .status-toggle button#btn-idle.active {
            background: #A80000;
            color: #000;
        }

        .bt-toggle {
            margin-top: 15px;
        }

        .bt-toggle button {
            width: 100%;
            padding: 10px;
            border: 2px solid;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .bt-toggle button#btn-connect {
            border-color: #00E676;
            color: #00E676;
        }

        .bt-toggle button#btn-connect:hover,
        .bt-toggle button#btn-connect.connected {
            background: #00E676;
            color: #000;
        }

        .bt-toggle button#btn-disconnect {
            border-color: #FF0000;
            color: #FF0000;
        }

        .bt-toggle button#btn-disconnect:hover {
            background: #FF0000;
            color: #000;
        }

        /* 说明文字 */
        .info {
            margin-top: 30px;
            text-align: center;
            color: #A80000;
            font-size: 0.9rem;
            max-width: 600px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <h1>JK-BMS 红色战斗风格预览</h1>

    <div class="container">
        <!-- 模拟屏幕 -->
        <div class="screen-wrapper">
            <div class="screen" id="screen">
                <div class="top-bar"></div>
                <div class="grid-overlay"></div>

                <!-- 标题栏 -->
                <div class="header">
                    <div class="title">JK-BMS COMBAT</div>
                    <div class="bt-status bt-connected" id="bt-status">
                        <div class="bt-icon">📡</div>
                        <div class="bt-text" id="bt-text">ONLINE</div>
                    </div>
                </div>

                <!-- 功率卡片 -->
                <div class="power-card">
                    <div class="power-label">实时功率</div>
                    <div style="display: flex; align-items: baseline;">
                        <div class="power-value" id="power-value">1250</div>
                        <div class="power-unit" id="power-unit">W</div>
                    </div>
                    <div class="power-bar-container">
                        <div class="power-bar-fill" id="power-bar" style="width: 25%; background: #FF0000;"></div>
                    </div>
                </div>

                <!-- 电压电流条 -->
                <div class="vi-bar">
                    <div class="vi-section">
                        <div class="vi-label">总电压</div>
                        <div class="vi-value voltage-value" id="voltage-value">52.50V</div>
                    </div>
                    <div class="divider"></div>
                    <div class="direction-arrow" id="direction-arrow" style="color: #FF0000;">▼</div>
                    <div class="vi-section">
                        <div class="vi-label">电流</div>
                        <div class="vi-value current-value" id="current-value">-23.80A</div>
                    </div>
                </div>

                <!-- 底部卡片 -->
                <div class="bottom-cards">
                    <div class="capacity-card">
                        <div class="card-label">电池容量</div>
                        <div class="capacity-main">
                            <div class="soc-value" id="soc-value">85%</div>
                            <div class="cap-detail" id="cap-detail">85.0/100Ah</div>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="soc-bar" style="width: 85%; background: #FF0000;"></div>
                        </div>
                    </div>
                    <div class="temp-card">
                        <div class="card-label">电池温度</div>
                        <div class="temp-main">
                            <div class="temp-value" id="temp-value" style="color: #FF0000;">28.5C</div>
                            <div class="mos-temp" id="mos-temp">MOS:32C</div>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="temp-bar" style="width: 60%; background: #FF0000;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="controls">
            <h2>交互控制</h2>

            <div class="control-group">
                <label>功率 (W)</label>
                <input type="range" id="power-slider" min="0" max="5000" value="1250" step="50">
                <div class="control-value"><span id="power-slider-val">1250</span> W</div>
            </div>

            <div class="control-group">
                <label>电压 (V)</label>
                <input type="range" id="voltage-slider" min="40" max="58.8" value="52.5" step="0.1">
                <div class="control-value"><span id="voltage-slider-val">52.50</span> V</div>
            </div>

            <div class="control-group">
                <label>电流 (A)</label>
                <input type="range" id="current-slider" min="-50" max="50" value="-23.8" step="0.1">
                <div class="control-value"><span id="current-slider-val">-23.80</span> A</div>
            </div>

            <div class="control-group">
                <label>电量 SOC (%)</label>
                <input type="range" id="soc-slider" min="0" max="100" value="85" step="1">
                <div class="control-value"><span id="soc-slider-val">85</span> %</div>
            </div>

            <div class="control-group">
                <label>温度 (C)</label>
                <input type="range" id="temp-slider" min="10" max="60" value="28.5" step="0.5">
                <div class="control-value"><span id="temp-slider-val">28.5</span> C</div>
            </div>

            <div class="control-group">
                <label>充放电状态</label>
                <div class="status-toggle">
                    <button id="btn-charge">充电</button>
                    <button id="btn-discharge" class="active">放电</button>
                    <button id="btn-idle">待机</button>
                </div>
            </div>

            <div class="control-group bt-toggle">
                <label>蓝牙连接</label>
                <button id="btn-connect" class="connected">连接 (ONLINE)</button>
            </div>
        </div>
    </div>

    <div class="info">
        <p>这是 JK-BMS 监控显示器的红色战斗风格效果模拟。</p>
        <p>使用右侧控制面板可以调整各项参数，实时预览显示效果！</p>
    </div>

    <script>
        // 状态管理
        let state = {
            power: 1250,
            voltage: 52.5,
            current: -23.8,
            soc: 85,
            temp: 28.5,
            mosTemp: 32,
            status: 'discharging',
            connected: true
        };

        // 获取功率颜色（战斗风格）
        function getPowerColor(power) {
            if (power < 0) return '#00E676'; // 充电绿色
            const maxPower = 5000;
            const ratio = Math.min(Math.max(power / maxPower, 0), 1);
            
            if (ratio < 0.33) {
                // 黄到橙
                const localRatio = ratio / 0.33;
                const r = 255;
                const g = Math.round(224 * (1 - localRatio));
                const b = 0;
                return `rgb(${r},${g},${b})`;
            } else if (ratio < 0.66) {
                // 橙到红橙
                const localRatio = (ratio - 0.33) / 0.33;
                const r = 255;
                const g = Math.round(128 * (1 - localRatio));
                const b = 0;
                return `rgb(${r},${g},${b})`;
            } else {
                // 红橙到红
                const localRatio = (ratio - 0.66) / 0.34;
                const r = 255;
                const g = Math.round(64 * (1 - localRatio));
                const b = 0;
                return `rgb(${r},${g},${b})`;
            }
        }

        // 获取温度颜色
        function getTempColor(temp) {
            if (temp < 20) return '#00E676';
            if (temp < 35) return '#FFE000';
            if (temp < 45) return '#FF8000';
            return '#FF0000';
        }

        // DOM元素
        const powerValue = document.getElementById('power-value');
        const powerUnit = document.getElementById('power-unit');
        const powerBar = document.getElementById('power-bar');
        const voltageValue = document.getElementById('voltage-value');
        const currentValue = document.getElementById('current-value');
        const socValue = document.getElementById('soc-value');
        const socBar = document.getElementById('soc-bar');
        const capDetail = document.getElementById('cap-detail');
        const tempValue = document.getElementById('temp-value');
        const tempBar = document.getElementById('temp-bar');
        const mosTemp = document.getElementById('mos-temp');
        const directionArrow = document.getElementById('direction-arrow');
        const btStatus = document.getElementById('bt-status');
        const btText = document.getElementById('bt-text');
        const btnConnect = document.getElementById('btn-connect');

        // 滑块
        const powerSlider = document.getElementById('power-slider');
        const voltageSlider = document.getElementById('voltage-slider');
        const currentSlider = document.getElementById('current-slider');
        const socSlider = document.getElementById('soc-slider');
        const tempSlider = document.getElementById('temp-slider');

        // 滑块值显示
        const powerSliderVal = document.getElementById('power-slider-val');
        const voltageSliderVal = document.getElementById('voltage-slider-val');
        const currentSliderVal = document.getElementById('current-slider-val');
        const socSliderVal = document.getElementById('soc-slider-val');
        const tempSliderVal = document.getElementById('temp-slider-val');

        // 按钮
        const btnCharge = document.getElementById('btn-charge');
        const btnDischarge = document.getElementById('btn-discharge');
        const btnIdle = document.getElementById('btn-idle');

        // 更新显示
        function updateDisplay() {
            const powerColor = getPowerColor(state.power);
            
            // 功率
            if (Math.abs(state.power) >= 1000) {
                powerValue.textContent = (Math.abs(state.power) / 1000).toFixed(2);
                powerUnit.textContent = 'kW';
            } else {
                powerValue.textContent = Math.round(Math.abs(state.power));
                powerUnit.textContent = 'W';
            }
            powerValue.style.color = powerColor;
            
            const powerPercent = Math.min(Math.abs(state.power) / 5000 * 100, 100);
            powerBar.style.width = powerPercent + '%';
            powerBar.style.background = powerColor;
            powerBar.style.boxShadow = `0 0 10px ${powerColor}`;

            // 电压电流
            voltageValue.textContent = state.voltage.toFixed(2) + 'V';
            currentValue.textContent = (state.current > 0 ? '+' : '') + state.current.toFixed(2) + 'A';
            currentValue.style.color = getPowerColor(state.current * -100);

            // SOC
            socValue.textContent = state.soc + '%';
            socBar.style.width = state.soc + '%';
            const remainAh = (state.soc / 100) * 100;
            capDetail.textContent = remainAh.toFixed(1) + '/100Ah';

            // 温度
            const tempColor = getTempColor(state.temp);
            tempValue.textContent = state.temp.toFixed(1) + 'C';
            tempValue.style.color = tempColor;
            const tempPercent = ((state.temp + 20) / 80) * 100;
            tempBar.style.width = Math.max(0, Math.min(100, tempPercent)) + '%';
            tempBar.style.background = tempColor;
            tempBar.style.boxShadow = `0 0 8px ${tempColor}`;
            mosTemp.textContent = 'MOS:' + state.mosTemp + 'C';

            // 方向箭头
            if (state.status === 'charging') {
                directionArrow.textContent = '▲';
                directionArrow.style.color = '#00E676';
            } else if (state.status === 'discharging') {
                directionArrow.textContent = '▼';
                directionArrow.style.color = '#FF0000';
            } else {
                directionArrow.textContent = '●';
                directionArrow.style.color = '#A80000';
            }

            // 蓝牙状态
            if (state.connected) {
                btStatus.className = 'bt-status bt-connected';
                btText.textContent = 'ONLINE';
                btnConnect.textContent = '连接 (ONLINE)';
                btnConnect.className = 'connected';
            } else {
                btStatus.className = 'bt-status bt-disconnected';
                btText.textContent = 'OFFLINE';
                btnConnect.textContent = '断开 (OFFLINE)';
                btnConnect.className = '';
            }
        }

        // 设置状态
        function setStatus(newStatus) {
            state.status = newStatus;
            btnCharge.classList.toggle('active', newStatus === 'charging');
            btnDischarge.classList.toggle('active', newStatus === 'discharging');
            btnIdle.classList.toggle('active', newStatus === 'idle');

            if (newStatus === 'charging' && state.current < 0) {
                state.current = Math.abs(state.current);
                currentSlider.value = state.current;
                currentSliderVal.textContent = state.current.toFixed(2);
            } else if (newStatus === 'discharging' && state.current > 0) {
                state.current = -Math.abs(state.current);
                currentSlider.value = state.current;
                currentSliderVal.textContent = state.current.toFixed(2);
            } else if (newStatus === 'idle') {
                state.current = 0;
                state.power = 0;
                currentSlider.value = 0;
                powerSlider.value = 0;
                currentSliderVal.textContent = '0.00';
                powerSliderVal.textContent = '0';
            }

            updateDisplay();
        }

        // 滑块事件
        powerSlider.addEventListener('input', (e) => {
            state.power = parseFloat(e.target.value);
            powerSliderVal.textContent = Math.round(state.power);
            updateDisplay();
        });

        voltageSlider.addEventListener('input', (e) => {
            state.voltage = parseFloat(e.target.value);
            voltageSliderVal.textContent = state.voltage.toFixed(2);
            updateDisplay();
        });

        currentSlider.addEventListener('input', (e) => {
            state.current = parseFloat(e.target.value);
            currentSliderVal.textContent = state.current.toFixed(2);

            if (state.current > 0.1) {
                state.status = 'charging';
                btnCharge.classList.add('active');
                btnDischarge.classList.remove('active');
                btnIdle.classList.remove('active');
            } else if (state.current < -0.1) {
                state.status = 'discharging';
                btnCharge.classList.remove('active');
                btnDischarge.classList.add('active');
                btnIdle.classList.remove('active');
            } else {
                state.status = 'idle';
                btnCharge.classList.remove('active');
                btnDischarge.classList.remove('active');
                btnIdle.classList.add('active');
            }

            state.power = Math.abs(state.voltage * state.current);
            powerSlider.value = state.power;
            powerSliderVal.textContent = Math.round(state.power);

            updateDisplay();
        });

        socSlider.addEventListener('input', (e) => {
            state.soc = parseInt(e.target.value);
            socSliderVal.textContent = state.soc;
            updateDisplay();
        });

        tempSlider.addEventListener('input', (e) => {
            state.temp = parseFloat(e.target.value);
            state.mosTemp = Math.round(state.temp + 3 + Math.random() * 3);
            tempSliderVal.textContent = state.temp.toFixed(1);
            updateDisplay();
        });

        // 按钮事件
        btnCharge.addEventListener('click', () => setStatus('charging'));
        btnDischarge.addEventListener('click', () => setStatus('discharging'));
        btnIdle.addEventListener('click', () => setStatus('idle'));

        btnConnect.addEventListener('click', () => {
            state.connected = !state.connected;
            updateDisplay();
        });

        // 初始更新
        updateDisplay();
    </script>
</body>
</html>
