<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK-BMS Battle Mode 预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            color: #FF0044;
            text-shadow: 0 0 20px rgba(255, 0, 68, 0.5);
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .main-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* ===== TFT Screen Simulation ===== */
        .tft-screen {
            width: 640px;
            height: 480px;
            background: #000;
            border: 4px solid #333;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 0 40px rgba(255, 0, 68, 0.15),
                inset 0 0 60px rgba(0,0,0,0.8);
        }

        .tft-content {
            width: 320px;
            height: 240px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(2);
            transform-origin: center;
        }

        /* ===== Battle Mode UI ===== */
        .screen-bg {
            width: 320px;
            height: 240px;
            background: #000000;
            position: relative;
        }

        /* Header */
        .header {
            position: absolute;
            top: 8px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 10px;
            font-weight: bold;
        }

        .title-white {
            color: #FFFFFF;
        }

        .title-red {
            color: #FF0044;
            text-shadow: 0 0 8px rgba(255, 0, 68, 0.6);
        }

        .bt-status {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .bt-icon {
            width: 14px;
            height: 14px;
            position: relative;
        }

        .bt-icon svg {
            width: 100%;
            height: 100%;
        }

        .bt-text {
            font-size: 8px;
            font-weight: bold;
        }

        .bt-online {
            color: #00FF41;
            text-shadow: 0 0 6px rgba(0, 255, 65, 0.5);
        }

        .bt-offline {
            color: #FF0044;
            text-shadow: 0 0 6px rgba(255, 0, 68, 0.5);
        }

        /* Battle Card */
        .battle-card {
            position: absolute;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-glow {
            position: absolute;
            inset: -1px;
            border-radius: 13px;
            opacity: 0.3;
        }

        .card-bg {
            position: absolute;
            inset: 0;
            border-radius: 12px;
        }

        .card-border {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            border: 1px solid;
        }

        .card-accent-top {
            position: absolute;
            top: 0;
            left: 8px;
            right: 8px;
            height: 2px;
            border-radius: 1px;
        }

        .card-corner {
            position: absolute;
            width: 6px;
            height: 6px;
        }

        .corner-tl { top: 2px; left: 2px; border-top: 1px solid; border-left: 1px solid; }
        .corner-tr { top: 2px; right: 2px; border-top: 1px solid; border-right: 1px solid; }
        .corner-bl { bottom: 2px; left: 2px; border-bottom: 1px solid; border-left: 1px solid; }
        .corner-br { bottom: 2px; right: 2px; border-bottom: 1px solid; border-right: 1px solid; }

        .card-content {
            position: absolute;
            inset: 0;
            padding: 8px 12px;
        }

        /* Power Card */
        .power-card {
            top: 32px;
            left: 12px;
            width: 296px;
            height: 90px;
        }

        .power-card .card-bg { background: #0A0000; }
        .power-card .card-border { border-color: #1A1A1A; }
        .power-card .card-glow { background: #330011; }

        .power-label-left {
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 8px;
            color: #888;
        }

        .power-label-right {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 8px;
            color: #888;
        }

        .power-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 15px currentColor;
        }

        .power-status {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            font-weight: bold;
        }

        /* Voltage/Current Bar */
        .vc-bar {
            top: 130px;
            left: 12px;
            width: 296px;
            height: 34px;
        }

        .vc-bar .card-bg { background: #0A0A0A; }
        .vc-bar .card-border { border-color: #1A1A1A; }
        .vc-bar .card-glow { background: #1A0A1A; }

        .vc-divider {
            position: absolute;
            top: 6px;
            bottom: 6px;
            left: 50%;
            width: 1px;
            background: #1A1A1A;
        }

        .vc-left, .vc-right {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            padding: 4px 12px;
        }

        .vc-left { left: 0; }
        .vc-right { right: 0; text-align: right; }

        .vc-label {
            font-size: 7px;
            color: #888;
            margin-bottom: 2px;
        }

        .vc-value {
            font-size: 14px;
            font-weight: bold;
        }

        .vc-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
        }

        .arrow-up {
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 6px solid;
        }

        .arrow-down {
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 6px solid;
        }

        .arrow-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #444;
        }

        /* Capacity Card */
        .capacity-card {
            top: 172px;
            left: 12px;
            width: 148px;
            height: 60px;
        }

        .capacity-card .card-bg { background: #00111A; }
        .capacity-card .card-border { border-color: #1A1A1A; }
        .capacity-card .card-glow { background: #001122; }

        .cap-label {
            font-size: 8px;
            color: #888;
            margin-bottom: 4px;
        }

        .cap-value {
            font-size: 16px;
            font-weight: bold;
            color: #00E5FF;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }

        .cap-detail {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-30%);
            font-size: 8px;
            color: #888;
        }

        .progress-bar {
            position: absolute;
            bottom: 8px;
            left: 10px;
            right: 10px;
            height: 6px;
            background: #001111;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* Temp Card */
        .temp-card {
            top: 172px;
            left: 172px;
            width: 136px;
            height: 60px;
        }

        .temp-card .card-bg { background: #1A0A00; }
        .temp-card .card-border { border-color: #1A1A1A; }

        .temp-label {
            font-size: 8px;
            color: #888;
            margin-bottom: 4px;
        }

        .temp-value {
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 8px currentColor;
        }

        .temp-mos {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-30%);
            font-size: 8px;
            color: #888;
        }

        /* Controls Panel */
        .controls {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            width: 300px;
        }

        .controls h2 {
            color: #FF0044;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
            color: #aaa;
        }

        .control-value {
            color: #fff;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #FF0044;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 68, 0.5);
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-charge {
            background: #003311;
            color: #00FF41;
            border: 1px solid #00FF41;
        }

        .btn-charge:hover, .btn-charge.active {
            background: #00FF41;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }

        .btn-discharge {
            background: #0A0000;
            color: #FF0044;
            border: 1px solid #FF0044;
        }

        .btn-discharge:hover, .btn-discharge.active {
            background: #FF0044;
            color: #000;
            box-shadow: 0 0 15px rgba(255, 0, 68, 0.4);
        }

        .btn-idle {
            background: #1A1A1A;
            color: #888;
            border: 1px solid #444;
        }

        .btn-idle:hover, .btn-idle.active {
            background: #444;
            color: #fff;
        }

        .legend {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }

        .legend h3 {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 11px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .bt-pulse {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <h1>JK-BMS BATTLE MODE</h1>
    <p class="subtitle">战斗风格实时监控界面预览 | 320x240 横屏</p>

    <div class="main-container">
        <!-- TFT Screen -->
        <div class="tft-screen">
            <div class="tft-content">
                <div class="screen-bg" id="screen">
                    <!-- Header -->
                    <div class="header">
                        <div class="title">
                            <span class="title-white">JK-BMS </span>
                            <span class="title-red">BATTLE MODE</span>
                        </div>
                        <div class="bt-status">
                            <div class="bt-icon" id="btIcon">
                                <svg viewBox="0 0 14 14" fill="none">
                                    <path d="M7 1v12M7 1l5 4-5 4M7 9l5 4" stroke="currentColor" stroke-width="1.5"/>
                                </svg>
                            </div>
                            <span class="bt-text bt-online" id="btText">ONLINE</span>
                        </div>
                    </div>

                    <!-- Power Card -->
                    <div class="battle-card power-card" id="powerCard">
                        <div class="card-glow"></div>
                        <div class="card-bg"></div>
                        <div class="card-border"></div>
                        <div class="card-accent-top" id="powerAccent"></div>
                        <div class="card-corner corner-tl" id="powerCornerTL"></div>
                        <div class="card-corner corner-tr" id="powerCornerTR"></div>
                        <div class="card-corner corner-bl" id="powerCornerBL"></div>
                        <div class="card-corner corner-br" id="powerCornerBR"></div>
                        <div class="card-content">
                            <span class="power-label-left">实时功率</span>
                            <span class="power-label-right">POWER</span>
                            <div class="power-value" id="powerValue">0 W</div>
                            <div class="power-status" id="powerStatus">待机</div>
                        </div>
                    </div>

                    <!-- Voltage/Current Bar -->
                    <div class="battle-card vc-bar" id="vcCard">
                        <div class="card-glow"></div>
                        <div class="card-bg"></div>
                        <div class="card-border"></div>
                        <div class="card-accent-top" style="background: #E040FB;"></div>
                        <div class="card-corner corner-tl" style="border-color: #E040FB;"></div>
                        <div class="card-corner corner-tr" style="border-color: #E040FB;"></div>
                        <div class="card-corner corner-bl" style="border-color: #E040FB;"></div>
                        <div class="card-corner corner-br" style="border-color: #E040FB;"></div>
                        <div class="vc-divider"></div>
                        <div class="vc-left">
                            <div class="vc-label">总电压</div>
                            <div class="vc-value" style="color: #E040FB; text-shadow: 0 0 6px rgba(224,64,251,0.4);" id="voltageValue">51.20V</div>
                        </div>
                        <div class="vc-right">
                            <div class="vc-label">电流</div>
                            <div class="vc-value" id="currentValue">0.00A</div>
                        </div>
                        <div class="vc-arrow arrow-dot" id="currentArrow"></div>
                    </div>

                    <!-- Capacity Card -->
                    <div class="battle-card capacity-card" id="capCard">
                        <div class="card-glow"></div>
                        <div class="card-bg"></div>
                        <div class="card-border"></div>
                        <div class="card-accent-top" style="background: #00E5FF;"></div>
                        <div class="card-corner corner-tl" style="border-color: #00E5FF;"></div>
                        <div class="card-corner corner-tr" style="border-color: #00E5FF;"></div>
                        <div class="card-corner corner-bl" style="border-color: #00E5FF;"></div>
                        <div class="card-corner corner-br" style="border-color: #00E5FF;"></div>
                        <div class="card-content">
                            <div class="cap-label">电池容量</div>
                            <div class="cap-value" id="socValue">85%</div>
                            <div class="cap-detail" id="capDetail">238/280Ah</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 85%; background: #00E5FF; box-shadow: 0 0 6px rgba(0,229,255,0.5);" id="socBar"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Temp Card -->
                    <div class="battle-card temp-card" id="tempCard">
                        <div class="card-glow"></div>
                        <div class="card-bg"></div>
                        <div class="card-border"></div>
                        <div class="card-accent-top" id="tempAccent"></div>
                        <div class="card-corner corner-tl" id="tempCornerTL"></div>
                        <div class="card-corner corner-tr" id="tempCornerTR"></div>
                        <div class="card-corner corner-bl" id="tempCornerBL"></div>
                        <div class="card-corner corner-br" id="tempCornerBR"></div>
                        <div class="card-content">
                            <div class="temp-label">电池温度</div>
                            <div class="temp-value" id="tempValue">28.5°C</div>
                            <div class="temp-mos" id="mosValue">MOS:32°C</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: 48%; background: #00FF41; box-shadow: 0 0 6px rgba(0,255,65,0.5);" id="tempBar"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <h2>参数控制</h2>

            <div class="control-group">
                <div class="control-label">
                    <span>功率 (W)</span>
                    <span class="control-value" id="powerCtrlVal">0</span>
                </div>
                <input type="range" id="powerSlider" min="0" max="3000" value="0" step="10">
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span>电流 (A)</span>
                    <span class="control-value" id="currentCtrlVal">0.00</span>
                </div>
                <input type="range" id="currentSlider" min="-50" max="50" value="0" step="0.1">
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span>电压 (V)</span>
                    <span class="control-value" id="voltageCtrlVal">51.20</span>
                </div>
                <input type="range" id="voltageSlider" min="40" max="60" value="51.2" step="0.01">
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span>SOC (%)</span>
                    <span class="control-value" id="socCtrlVal">85</span>
                </div>
                <input type="range" id="socSlider" min="0" max="100" value="85" step="1">
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span>温度 (°C)</span>
                    <span class="control-value" id="tempCtrlVal">28.5</span>
                </div>
                <input type="range" id="tempSlider" min="-20" max="80" value="28.5" step="0.1">
            </div>

            <div class="btn-group">
                <button class="btn-charge" id="btnCharge" onclick="setMode('charge')">充电</button>
                <button class="btn-idle active" id="btnIdle" onclick="setMode('idle')">待机</button>
                <button class="btn-discharge" id="btnDischarge" onclick="setMode('discharge')">放电</button>
            </div>

            <div class="legend">
                <h3>颜色说明</h3>
                <div class="legend-item">
                    <div class="legend-color" style="background: #00FF41;"></div>
                    <span>充电中 (负电流)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #00AAFF;"></div>
                    <span>小功率放电</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #0088FF;"></div>
                    <span>中功率放电</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #FF0044;"></div>
                    <span>大功率放电</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let mode = 'idle';
        let power = 0;
        let current = 0;
        let voltage = 51.2;
        let soc = 85;
        let temp = 28.5;

        function getPowerColor(p) {
            const absP = Math.abs(p);
            if (absP < 100) return '#00FF00';
            if (absP < 500) return '#FFFF00';
            if (absP < 1000) return '#FF8800';
            return '#FF0000';
        }

        function getCurrentColor(c) {
            if (c < 0) return '#00FF41';
            if (c < 1) return '#00AAFF';
            if (c < 10) return '#0088FF';
            return '#FF0044';
        }

        function getTempColor(t) {
            if (t < 10) return '#00AAFF';
            if (t < 35) return '#00FF41';
            if (t < 50) return '#FFAA00';
            return '#FF0044';
        }

        function updateDisplay() {
            // Power
            const powerColor = getPowerColor(power);
            const powerEl = document.getElementById('powerValue');
            powerEl.textContent = Math.abs(power) >= 1000 ? (Math.abs(power)/1000).toFixed(2) + ' kW' : Math.abs(power).toFixed(0) + ' W';
            powerEl.style.color = powerColor;

            document.getElementById('powerAccent').style.background = powerColor;
            ['powerCornerTL', 'powerCornerTR', 'powerCornerBL', 'powerCornerBR'].forEach(id => {
                document.getElementById(id).style.borderColor = powerColor;
            });

            const statusEl = document.getElementById('powerStatus');
            if (current < -0.1) {
                statusEl.textContent = '充电中';
                statusEl.style.color = '#00FF41';
            } else if (current > 0.1) {
                statusEl.textContent = '放电中';
                statusEl.style.color = powerColor;
            } else {
                statusEl.textContent = '待机';
                statusEl.style.color = '#888';
            }

            // Current
            const currentColor = getCurrentColor(current);
            const currentEl = document.getElementById('currentValue');
            currentEl.textContent = current.toFixed(2) + 'A';
            currentEl.style.color = currentColor;
            currentEl.style.textShadow = `0 0 6px ${currentColor}66`;

            const arrowEl = document.getElementById('currentArrow');
            arrowEl.className = 'vc-arrow';
            if (current < -0.1) {
                arrowEl.classList.add('arrow-up');
                arrowEl.style.borderBottomColor = '#00FF41';
            } else if (current > 0.1) {
                arrowEl.classList.add('arrow-down');
                arrowEl.style.borderTopColor = currentColor;
            } else {
                arrowEl.classList.add('arrow-dot');
            }

            // Voltage
            document.getElementById('voltageValue').textContent = voltage.toFixed(2) + 'V';

            // SOC
            document.getElementById('socValue').textContent = soc + '%';
            document.getElementById('capDetail').textContent = (soc * 2.8).toFixed(1) + '/280Ah';
            document.getElementById('socBar').style.width = soc + '%';

            // Temp
            const tempColor = getTempColor(temp);
            document.getElementById('tempValue').textContent = temp.toFixed(1) + '°C';
            document.getElementById('tempValue').style.color = tempColor;
            document.getElementById('tempAccent').style.background = tempColor;
            ['tempCornerTL', 'tempCornerTR', 'tempCornerBL', 'tempCornerBR'].forEach(id => {
                document.getElementById(id).style.borderColor = tempColor;
            });
            document.getElementById('tempBar').style.background = tempColor;
            document.getElementById('tempBar').style.width = Math.min(100, Math.max(0, (temp + 20) / 80 * 100)) + '%';
        }

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn' + m.charAt(0).toUpperCase() + m.slice(1)).classList.add('active');

            if (m === 'charge') {
                current = -Math.abs(current) || -5;
                power = -Math.abs(power) || -voltage * Math.abs(current);
            } else if (m === 'discharge') {
                current = Math.abs(current) || 5;
                power = Math.abs(power) || voltage * current;
            } else {
                current = 0;
                power = 0;
            }

            document.getElementById('currentSlider').value = current;
            document.getElementById('powerSlider').value = Math.abs(power);
            document.getElementById('currentCtrlVal').textContent = current.toFixed(2);
            document.getElementById('powerCtrlVal').textContent = Math.abs(power).toFixed(0);
            updateDisplay();
        }

        // Event listeners
        document.getElementById('powerSlider').addEventListener('input', (e) => {
            power = parseFloat(e.target.value);
            if (mode === 'charge') power = -power;
            document.getElementById('powerCtrlVal').textContent = Math.abs(power).toFixed(0);
            updateDisplay();
        });

        document.getElementById('currentSlider').addEventListener('input', (e) => {
            current = parseFloat(e.target.value);
            if (current < -0.1) mode = 'charge';
            else if (current > 0.1) mode = 'discharge';
            else mode = 'idle';
            power = voltage * current;
            document.getElementById('powerSlider').value = Math.abs(power);
            document.getElementById('currentCtrlVal').textContent = current.toFixed(2);
            document.getElementById('powerCtrlVal').textContent = Math.abs(power).toFixed(0);
            updateDisplay();
        });

        document.getElementById('voltageSlider').addEventListener('input', (e) => {
            voltage = parseFloat(e.target.value);
            document.getElementById('voltageCtrlVal').textContent = voltage.toFixed(2);
            updateDisplay();
        });

        document.getElementById('socSlider').addEventListener('input', (e) => {
            soc = parseInt(e.target.value);
            document.getElementById('socCtrlVal').textContent = soc;
            updateDisplay();
        });

        document.getElementById('tempSlider').addEventListener('input', (e) => {
            temp = parseFloat(e.target.value);
            document.getElementById('tempCtrlVal').textContent = temp.toFixed(1);
            updateDisplay();
        });

        // Initial update
        updateDisplay();
    </script>
</body>
</html>
